name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /home/ubuntu/apps/backend

            echo ">>> Pulling latest code..."
            git pull origin main

            # `npm ci`, not `npm install`: it installs exactly what the lockfile says and
            # fails if package.json and the lockfile disagree, instead of quietly
            # resolving different versions on the server than were tested.
            echo ">>> Installing dependencies..."
            npm ci --include=dev

            # tsc does not prune dist, so files deleted from src would linger as stale
            # JS — that once left superseded migrations in dist/migrations. So dist is
            # rebuilt from scratch, but the previous build is kept aside first: this
            # used to `rm -rf dist` and then build, so a failed build left the API
            # running from memory with nothing on disk — one crash or reboot from down.
            echo ">>> Keeping the previous build..."
            rm -rf dist.prev
            if [ -d dist ]; then cp -a dist dist.prev; fi
            restore_previous_build() {
              echo ">>> Restoring the previous build"
              rm -rf dist
              if [ -d dist.prev ]; then mv dist.prev dist; fi
            }

            echo ">>> Building..."
            rm -rf dist
            if ! npm run build; then
              restore_previous_build
              exit 1
            fi

            echo ">>> Running migrations..."
            if ! NODE_ENV=production npm run migration:run; then
              restore_previous_build
              exit 1
            fi

            # A 12s kill timeout lets the 10s graceful shutdown in server.ts finish
            # in-flight PayPal captures; pm2's default (1.6s) cut it off. Falls back to
            # a plain restart if this pm2 doesn't take the flag on restart.
            echo ">>> Restarting backend..."
            pm2 restart kimatrix-api --kill-timeout 12000 || pm2 restart kimatrix-api

            # /ready, not /health: /health answers even with the database or Redis
            # down, so a deploy could "pass" while every real request failed.
            echo ">>> Readiness check..."
            if ! curl -sf --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:9420/ready -o /dev/null; then
              pm2 logs kimatrix-api --lines 40 --nostream
              exit 1
            fi

            rm -rf dist.prev
            echo ">>> Deploy complete!"
